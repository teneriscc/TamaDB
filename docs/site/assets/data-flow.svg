<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 620" font-family="Consolas, 'Courier New', monospace" font-size="12">
  <!-- Definitions -->
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#5F6B7A"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#006CE0"/>
    </marker>
    <marker id="arr-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0EA5A4"/>
    </marker>
    <marker id="arr-left" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto">
      <path d="M8,0 L0,4 L8,8 Z" fill="#5F6B7A"/>
    </marker>
  </defs>

  <!-- Column headers -->
  <text x="100" y="30" text-anchor="middle" font-weight="bold" fill="#161D26" font-size="14">Producer</text>
  <text x="410" y="30" text-anchor="middle" font-weight="bold" fill="#161D26" font-size="14">TamaDB</text>
  <text x="720" y="30" text-anchor="middle" font-weight="bold" fill="#161D26" font-size="14">Consumer</text>

  <!-- Vertical lifelines -->
  <line x1="100" y1="45" x2="100" y2="600" stroke="#D5DBDB" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="410" y1="45" x2="410" y2="600" stroke="#D5DBDB" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="720" y1="45" x2="720" y2="600" stroke="#D5DBDB" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Step 0: POST request -->
  <line x1="105" y1="75" x2="403" y2="75" stroke="#5F6B7A" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="254" y="68" text-anchor="middle" fill="#5F6B7A" font-size="11">POST /ingest/{docType}/{channel}</text>

  <!-- TamaDB processing steps (vertical block) -->
  <rect x="290" y="95" width="240" height="370" rx="4" fill="#f8f9fa" stroke="#D5DBDB" stroke-width="1"/>
  <text x="410" y="115" text-anchor="middle" fill="#006CE0" font-weight="bold" font-size="11">PROCESSING PIPELINE</text>

  <!-- Step 1 -->
  <rect x="310" y="125" width="200" height="28" rx="3" fill="#fff" stroke="#D5DBDB" stroke-width="1"/>
  <text x="325" y="143" fill="#5F6B7A" font-size="11">1.</text>
  <text x="345" y="143" fill="#161D26" font-size="11">Parse JSON</text>

  <!-- Step 2 -->
  <rect x="310" y="160" width="200" height="28" rx="3" fill="#fff" stroke="#D5DBDB" stroke-width="1"/>
  <text x="325" y="178" fill="#5F6B7A" font-size="11">2.</text>
  <text x="345" y="178" fill="#161D26" font-size="11">Enrich (channel fields)</text>

  <!-- Step 3 -->
  <rect x="310" y="195" width="200" height="28" rx="3" fill="#fff" stroke="#D5DBDB" stroke-width="1"/>
  <text x="325" y="213" fill="#5F6B7A" font-size="11">3.</text>
  <text x="345" y="213" fill="#161D26" font-size="11">Extract D-Id</text>

  <!-- Step 4 -->
  <rect x="310" y="230" width="200" height="28" rx="3" fill="#fff" stroke="#D5DBDB" stroke-width="1"/>
  <text x="325" y="248" fill="#5F6B7A" font-size="11">4.</text>
  <text x="345" y="248" fill="#161D26" font-size="11">Validate schema (DCM)</text>

  <!-- Step 5 -->
  <rect x="310" y="265" width="200" height="28" rx="3" fill="#fff" stroke="#D5DBDB" stroke-width="1"/>
  <text x="325" y="283" fill="#5F6B7A" font-size="11">5.</text>
  <text x="345" y="283" fill="#161D26" font-size="11">Merge into stored doc</text>

  <!-- Step 6 -->
  <rect x="310" y="300" width="200" height="28" rx="3" fill="#fff" stroke="#D5DBDB" stroke-width="1"/>
  <text x="325" y="318" fill="#5F6B7A" font-size="11">6.</text>
  <text x="345" y="318" fill="#161D26" font-size="11">Version (timestamp + vNo)</text>

  <!-- Step 7 -->
  <rect x="310" y="335" width="200" height="28" rx="3" fill="#fff" stroke="#D5DBDB" stroke-width="1"/>
  <text x="325" y="353" fill="#5F6B7A" font-size="11">7.</text>
  <text x="345" y="353" fill="#161D26" font-size="11">Register TTL expiry</text>

  <!-- Step 8 -->
  <rect x="310" y="370" width="200" height="28" rx="3" fill="#fff" stroke="#D5DBDB" stroke-width="1"/>
  <text x="325" y="388" fill="#5F6B7A" font-size="11">8.</text>
  <text x="345" y="388" fill="#161D26" font-size="11">Match subscriptions</text>

  <!-- Step 9 -->
  <rect x="310" y="405" width="200" height="28" rx="3" fill="#fff" stroke="#D5DBDB" stroke-width="1"/>
  <text x="325" y="423" fill="#5F6B7A" font-size="11">9.</text>
  <text x="345" y="423" fill="#161D26" font-size="11">Snapshot + enqueue</text>

  <!-- Response: TamaDB → Producer -->
  <line x1="403" y1="490" x2="105" y2="490" stroke="#5F6B7A" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="254" y="483" text-anchor="middle" fill="#5F6B7A" font-size="11">201 {dId, versionNo}</text>

  <!-- Webhook: TamaDB → Consumer -->
  <line x1="417" y1="540" x2="713" y2="540" stroke="#006CE0" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="565" y="533" text-anchor="middle" fill="#006CE0" font-size="11">POST callbackUrl (webhook)</text>

  <!-- Response: Consumer → TamaDB -->
  <line x1="713" y1="575" x2="417" y2="575" stroke="#0EA5A4" stroke-width="1.5" marker-end="url(#arr-teal)"/>
  <text x="565" y="568" text-anchor="middle" fill="#0EA5A4" font-size="11">200 OK</text>
</svg>
