<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" font-family="Consolas, 'Courier New', monospace" font-size="13">
  <!-- Background -->
  <rect width="820" height="340" fill="none"/>

  <!-- Transmission Layer boundary -->
  <rect x="20" y="20" width="780" height="300" rx="6" fill="none" stroke="#006CE0" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="410" y="42" text-anchor="middle" font-size="11" fill="#006CE0" font-weight="bold">TRANSMISSION LAYER</text>

  <!-- Receiving Bay box -->
  <rect x="50" y="60" width="220" height="200" rx="4" fill="#e3f2fd" stroke="#006CE0" stroke-width="1.5"/>
  <text x="160" y="85" text-anchor="middle" font-weight="bold" fill="#161D26">RECEIVING BAY</text>
  <text x="160" y="102" text-anchor="middle" fill="#5F6B7A" font-size="11">(Inbound)</text>

  <text x="80" y="135" fill="#333333" font-size="12">• Parse</text>
  <text x="80" y="158" fill="#333333" font-size="12">• Enrich</text>
  <text x="80" y="181" fill="#333333" font-size="12">• Extract D-Id</text>
  <text x="80" y="204" fill="#333333" font-size="12">• Validate</text>

  <!-- Hold box -->
  <rect x="300" y="60" width="220" height="200" rx="4" fill="#f8f9fa" stroke="#5F6B7A" stroke-width="1.5"/>
  <text x="410" y="85" text-anchor="middle" font-weight="bold" fill="#161D26">HOLD</text>
  <text x="410" y="102" text-anchor="middle" fill="#5F6B7A" font-size="11">(State)</text>

  <text x="330" y="135" fill="#333333" font-size="12">• Merge</text>
  <text x="330" y="158" fill="#333333" font-size="12">• Version</text>
  <text x="330" y="181" fill="#333333" font-size="12">• History</text>
  <text x="330" y="204" fill="#333333" font-size="12">• TTL registration</text>
  <text x="330" y="227" fill="#333333" font-size="12">• Lifecycle</text>

  <!-- Dispatch Bay box -->
  <rect x="550" y="60" width="220" height="200" rx="4" fill="#f0fdf4" stroke="#0EA5A4" stroke-width="1.5"/>
  <text x="660" y="85" text-anchor="middle" font-weight="bold" fill="#161D26">DISPATCH BAY</text>
  <text x="660" y="102" text-anchor="middle" fill="#5F6B7A" font-size="11">(Outbound)</text>

  <text x="580" y="135" fill="#333333" font-size="12">• Match subscriptions</text>
  <text x="580" y="158" fill="#333333" font-size="12">• Format payload</text>
  <text x="580" y="181" fill="#333333" font-size="12">• Shape (filter,</text>
  <text x="600" y="198" fill="#333333" font-size="12">restructure,</text>
  <text x="600" y="215" fill="#333333" font-size="12">translate)</text>
  <text x="580" y="238" fill="#333333" font-size="12">• Enqueue delivery</text>

  <!-- Arrows between bays -->
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#5F6B7A"/>
    </marker>
  </defs>

  <line x1="270" y1="160" x2="298" y2="160" stroke="#5F6B7A" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="520" y1="160" x2="548" y2="160" stroke="#5F6B7A" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Governance labels -->
  <text x="160" y="282" text-anchor="middle" fill="#006CE0" font-size="11" font-weight="bold">Producer-instructed</text>
  <text x="410" y="282" text-anchor="middle" fill="#5F6B7A" font-size="11" font-weight="bold">Custodial only</text>
  <text x="660" y="282" text-anchor="middle" fill="#0EA5A4" font-size="11" font-weight="bold">Consumer-instructed</text>

  <!-- Legend -->
  <text x="410" y="310" text-anchor="middle" fill="#888" font-size="10">TamaDB operates across all three levels · PamaDB extends only the Dispatch Bay</text>
</svg>
