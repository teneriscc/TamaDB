  /api/v1/config/channels:
    post:
      tags: [Channels]
      operationId: registerChannel
      summary: Register a channel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                channelId:
                  type: string
                documentType:
                  type: string
                channelSchema:
                  type: string
                  description: Optional Channel_Schema ref.
                initialStatus:
                  type: string
                  enum: [active, inactive]
                  description: |
                    The channel's status at registration (default `active`):
                    - `active` — accepts ingestion immediately.
                    - `inactive` — registered but suspended; ingestion is
                      rejected with `CHANNEL_INACTIVE` until activated.
              required: [channelId, documentType]
            example:
              channelId: garage-sensor
              documentType: temperature-readings
              channelSchema: temperature-sensor-v1
      responses:
        '201':
          description: Registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelConfig'
              example:
                channelId: garage-sensor
                documentType: temperature-readings
                channelSchema: temperature-sensor-v1
                enrichmentBindings: []
                status: active
                endpoint: /api/v1/ingest/temperature-readings/garage-sensor
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      tags: [Channels]
      operationId: listChannels
      summary: List channels
      parameters:
        - name: documentType
          in: query
          required: false
          description: Filter channels by Document_Type.
          schema:
            type: string
      responses:
        '200':
          description: Channels.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChannelConfig'
              example:
                - channelId: garage-sensor
                  documentType: temperature-readings
                  channelSchema: temperature-sensor-v1
                  enrichmentBindings:
                    - fieldPath: sensorId
                      staticValue: GARAGE-TEMP-01
                    - fieldPath: location
                      staticValue: Garage
                  status: active
                  endpoint: /api/v1/ingest/temperature-readings/garage-sensor

  /api/v1/config/channels/{channelId}:
    put:
      tags: [Channels]
      operationId: updateChannel
