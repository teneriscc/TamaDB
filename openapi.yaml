  /api/v1/quarantine:
    get:
      tags: [Quarantine]
      operationId: listQuarantine
      summary: List quarantined payloads
      parameters:
        - name: rejectionType
          in: query
          required: false
          description: |
            Filter by why the payload was quarantined:
            - `parse-error` — the body was not valid JSON (`PARSE_ERROR`).
            - `validation-failure` — the document failed schema validation.
          schema:
            type: string
            enum: [parse-error, validation-failure]
        - name: sourceIdentifier
          in: query
          required: false
          description: Filter by the ingestion source identifier (e.g. channel).
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: Quarantine entries.
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items:
                      $ref: '#/components/schemas/QuarantineEntry'
                  count:
                    type: integer
                required: [entries, count]
              example:
                entries:
                  - ref: qr-muu900r6-0001
                    payload:
                      sensorId: BAD-1
                      location: X
                      temperature: not-a-number
                      extra: nope
                    context:
                      receivedAt: '2026-07-17T10:20:00Z'
                      sourceIdentifier: default
                      schemaRef: temperature-sensor-v1
                      rejectionReason: "/extra: Field 'extra' is not defined in the schema (DCM: no extensions allowed); /temperature: must be number"
                      rejectionType: validation-failure
                      controlHeaders: {}
                count: 1

