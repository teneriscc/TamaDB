                  type: string
                  description: Required when destination is `file`.
              required: [destination]
            example:
              destination: stdout
      responses:
        '200':
          description: Logging state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoggingState'
              example:
                level: info
                destination: stdout
        '400':
          $ref: '#/components/responses/BadRequest'

components:
  parameters:
    DocumentTypePath:
      name: documentType
      in: path
      required: true
      description: The Document_Type name.
      schema:
        type: string
    ChannelIdPath:
      name: channelId
      in: path
      required: true
      description: The channel identifier.
      schema:
        type: string
    SchemaRefPath:
      name: schemaRef
      in: path
      required: true
      description: The schema reference.
      schema:
        type: string
    DIdPath:
      name: dId
      in: path
      required: true
      description: >
        The document identity. A composed D-Id joins its percent-encoded parts
        with the `:` delimiter (e.g. `ORD-1001:L-1`). Glob characters (`*`, `?`)
        switch GET to glob retrieval.
      schema:
        type: string
      examples:
        single:
          summary: Single-key D-Id
          value: GARAGE-TEMP-01
        composed:
          summary: Composed (multi-field) D-Id
          value: ORD-1001:L-1
        glob:
          summary: Glob (match all)
          value: '*'
    TamaDBVersion:
      name: TamaDB-Version
      in: header
      required: false
      description: >
        Expected version number for optimistic concurrency — a positive integer
        (≥ 1). A mismatch is rejected with `VERSION_CONFLICT`.
      schema:
        type: integer
        minimum: 1
      example: 2
    TamaDBTtl:
      name: TamaDB-TTL
      in: header
      required: false
      description: >
        Document-level TTL — a non-negative integer number of seconds, or the
        literal `infinite`.
      schema:
        oneOf:
          - type: integer
            minimum: 0
          - type: string
            const: infinite
      example: 3600
    TamaDBExpireAt:
      name: TamaDB-Expire-At
      in: header
      required: false
      description: >
        Absolute expiry instant as an ISO-8601 / RFC 3339 date-time that
        **must carry an explicit timezone** (a trailing `Z` or a `±HH:MM`
        offset). A timezone-less value is rejected with
        `INVALID_CONTROL_HEADER`.
      schema:
        type: string
        format: date-time
      example: '2026-07-17T18:00:00Z'
    TamaDBSchema:
      name: TamaDB-Schema
      in: header
      required: false
      description: >
        Explicit Storage_Schema override (a non-empty schema ref). This is the
        only way to override the schema per request — it is header-only.
      schema:
        type: string
        minLength: 1
      example: temperature-sensor-v1

  requestBodies:
    BareDocument:
      required: true
      description: >
        The **bare JSON document** — a JSON object, with no wrapper. A malformed
        body becomes a `PARSE_ERROR` and is quarantined per policy; a valid-JSON
        non-object is likewise a `PARSE_ERROR`.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
            description: The document payload (arbitrary JSON object).
          examples:
            directIngest:
              summary: Direct ingest (Document_Type level)
              description: >
                A complete reading sent to the default channel. The D-Id is
                extracted from the `sensorId` field (the `primary-key`).
              value:
                sensorId: LIVING-ROOM-01
                location: Living Room
                temperature: 21.5
                timestamp: '2026-07-17T10:05:00Z'
            channelIngest:
              summary: Channel ingest (enrichment supplies identity)
              description: >
                A minimal reading sent via the `garage-sensor` channel; its
                enrichment bindings inject `sensorId` and `location` before
                storage.
              value:
                temperature: 18.2
                timestamp: '2026-07-17T10:06:00Z'

  responses:
    IngestCreated:
      description: Document created.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IngestResult'
          examples:
            created:
              summary: First write — created
              value:
                dId: GARAGE-TEMP-01
                versionNo: 1
                created: true
            createdComposed:
              summary: Composed (multi-field) D-Id — created
              description: A composed D-Id is returned as an array of parts.
              value:
                dId: [ORD-1001, L-2]
                versionNo: 1
                created: true
    IngestMerged:
      description: Existing document merged (upsert).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IngestResult'
          examples:
            merged:
              summary: Subsequent write — merged (version incremented)
              value:
                dId: GARAGE-TEMP-01
                versionNo: 2
                created: false
    BadRequest:
      description: >
        Bad request — e.g. `PARSE_ERROR`, `INVALID_CONTROL_HEADER`,
        `INVALID_SCHEMA`, `INVALID_NAME`, `EMPTY_BINDINGS`,
        `INVALID_FIELD_PATH`, `NO_DID_DEFINITION`, `NO_PRIMARY_KEY`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidControlHeader:
              summary: Invalid TamaDB-* control header
              value:
                code: INVALID_CONTROL_HEADER
                message: 'Invalid value for header TamaDB-Version: expected a positive integer (>= 1)'
    Forbidden:
      description: >
        Forbidden — e.g. `CHANNEL_INACTIVE`, `CHANNEL_BLOCKED`,
        `MASTER_SCHEMA_ACTIVE`, `DOCUMENTS_EXIST`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: >
        Not found — e.g. `DOCUMENT_NOT_FOUND`, `SCHEMA_NOT_FOUND`,
        `DOCUMENT_TYPE_NOT_FOUND`, `CHANNEL_NOT_FOUND`, `QUARANTINE_NOT_FOUND`,
        `SUBSCRIPTION_NOT_FOUND`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            documentNotFound:
              summary: No such document
              value:
                code: DOCUMENT_NOT_FOUND
                message: Document not found
    Conflict:
      description: >
        Conflict — e.g. `VERSION_CONFLICT`, `ENRICHMENT_CONFLICT`,
        `SCHEMA_ALREADY_EXISTS`, `DOCUMENT_TYPE_ALREADY_EXISTS`,
        `CHANNEL_ALREADY_EXISTS`, `ALREADY_DECOMMISSIONED`, `ALREADY_ACTIVE`,
        `ALREADY_DELETED`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            versionConflict:
              summary: Optimistic-concurrency mismatch
              value:
                code: VERSION_CONFLICT
                message: 'Version conflict: expected 99, current is 3'
    Unprocessable:
      description: Schema validation failed (`SCHEMA_VALIDATION_FAILED`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            schemaValidationFailed:
              summary: DCM validation failure (quarantined)
              value:
                code: SCHEMA_VALIDATION_FAILED
                message: "/extra: Field 'extra' is not defined in the schema (DCM: no extensions allowed); /temperature: must be number"
                quarantineRef: qr-muu900r6-0001

  schemas:
    Ttl:
      description: Time-to-live in seconds, or the literal `infinite`.
      oneOf:
        - type: integer
          minimum: 0
        - type: string
          const: infinite
    TtlWarning:
      type: object
      description: Emitted when a requested TTL was raised to the configured floor.
      properties:
        code:
          type: string
        message:
          type: string
        appliedTtl:
          $ref: '#/components/schemas/Ttl'
    DocumentModel:
      type: string
      enum: [closed, hybrid, open]
      description: |
        The validation model for a Document_Type:
        - `closed` — **DCM** (Document_Closed_Model): strict validation; only
          fields defined in the Master_Schema are allowed (no extensions).
        - `hybrid` — **HDOM** (Hybrid_Document_Open_Model): Master_Schema
          validation is enforced, but documents may carry additional fields.
        - `open` — **DOM** (Document_Open_Model): no schema enforcement; any
          structure is accepted.
    StorageMode:
      type: string
      enum: [auto, memory, disk, hybrid]
      description: |
        The storage strategy governing where documents are held:
        - `auto` — the engine selects a strategy automatically.
        - `memory` — in-memory only (fastest; not durable across restart).
        - `disk` — persisted to disk (durable; nothing buffered in memory).
        - `hybrid` — in-memory working set with disk persistence.

        `/health` reports the active mode; `GET/PUT /api/v1/config/storage-strategy`
        reads and changes it at runtime.
    LogLevel:
      type: string
      enum: [debug, info, warn, error, silent]
      description: |
        The active log verbosity, most to least verbose:
        - `debug` — everything (default).
        - `info` — informational events and above.
        - `warn` — warnings and errors only.
        - `error` — errors only.
        - `silent` — logging disabled.
    DId:
      description: >
        A document identity — a string for a single-key D-Id, or an array of
        strings for a composed (multi-field) D-Id.
      oneOf:
        - type: string
        - type: array
          items:
            type: string
    StoredDId:
      type: object
      description: >
        The internal (stored) form of a document identity, as currently returned
        in a subscription record. `single` carries `value`; `composed` carries
        `parts`. **Note:** this differs from the normalised D-Id wire form
        (string / array of strings) used by every other endpoint — a known
        inconsistency (the subscription output path leaks the internal object).
        It is slated to be normalised to the shared `DId` form in 0.6.0 (see
        `docs/working-notes/defect-subscription-did-representation.md`); the shape
        here documents the current behaviour truthfully until then.
      properties:
        type:
          type: string
          enum: [single, composed]
        value:
          type: string
          description: Present when `type` is `single`.
        parts:
          type: array
          items:
            type: string
          description: Present when `type` is `composed`.
      required: [type]
    Health:
      type: object
      properties:
        status:
          const: ok
          description: Always `ok` when the instance is serving.
        version:
          type: string
          description: Resolved from package.json at runtime.
        commit:
          type: string
          description: Build commit; `unknown` when no build-info is present.
        storageMode:
          $ref: '#/components/schemas/StorageMode'
        logLevel:
          $ref: '#/components/schemas/LogLevel'
      required: [status, version, commit, storageMode, logLevel]
    ServiceInfo:
      type: object
      description: Service-discovery metadata returned by `GET /api/v1/info`.
      properties:
        name:
          type: string
          description: Service/application name (from package.json).
        description:
          type: string
          description: One-line service description (from package.json).
        version:
          type: string
          description: Current semantic version (from package.json), e.g. `0.5.1`.
        commit:
          type: string
          description: Build commit; `unknown` when no build-info is present.
        apiVersion:
          type: string
          description: The URL contract version segment, e.g. `v1` (the `/api/v1` prefix).
        environment:
          type: string
          description: >
            Deployment stage label (configurable via `TAMADB_ENV`). Increment 1
            defaults to `increment-1` (PoC — no production deployment).
          example: increment-1
        status:
          type: string
          description: Operational state.
          example: operational
        documentation:
          type: string
          format: uri
          description: URL of the human-facing API reference (Redoc).
        openapi:
          type: string
          format: uri
          description: URL of the machine-readable OpenAPI document, for tooling discovery.
        startedAt:
          type: string
          format: date-time
          description: Process start time (ISO 8601), for a rough uptime signal.
      required: [name, version, commit, apiVersion, environment, status, documentation, openapi, startedAt]
    IngestResult:
      type: object
      properties:
        dId:
          $ref: '#/components/schemas/DId'
        versionNo:
          type: integer
        created:
          type: boolean
          description: True on create (201), false on merge (200).
        warning:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
          required: [code, message]
      required: [dId, versionNo, created]
    Document:
      type: object
      additionalProperties: true
      description: >
        A retrieved document. On a default GET, the response body is the **stored
        document itself** — the producer's fields (plus any enrichment), exactly
        as a consumer should read them. The example shows the `temperature-readings`
        case. Internal version/TTL/soft-delete metadata and the structural
        leaf/bunch tree are not part of the default retrieval shape; a field
        projection (`?path=`) returns a `{ "_value": ... }` wrapper instead.
    DocumentMatches:
      type: object
      description: A collection result (glob retrieval or value search).
      properties:
        matches:
          type: array
          items:
            $ref: '#/components/schemas/Document'
        count:
          type: integer
      required: [matches, count]
    JsonSchema:
      type: object
      additionalProperties: true
      description: >
        A JSON Schema document. May carry the TamaDB-specific `identityKind`
        keyword (`primary-key` / `parent-key`) on scalar leaf properties; that
        keyword is ignored by validation and read only by the D-Id Extractor.
    DIdDefinition:
      type: object
      description: Metadata fallback D-Id definition for schemas not annotated inline.
      properties:
        type:
          type: string
          enum: [single, composed]
          description: >
            `single` — one field forms the identity; `composed` — multiple
            fields are combined into a multi-part D-Id.
        fields:
          type: array
          items:
            type: string
          description: Field names or dotted field paths contributing to the D-Id.
      required: [type, fields]
    SchemaRegisterResult:
      type: object
      properties:
        ref:
          type: string
        version:
          type: integer
      required: [ref, version]
    SchemaVersion:
      type: object
      properties:
        version:
          type: integer
        schema:
          $ref: '#/components/schemas/JsonSchema'
        timestamp:
          type: string
          format: date-time
      required: [version, schema, timestamp]
    SchemaEntry:
      type: object
      properties:
        ref:
          type: string
        schema:
          $ref: '#/components/schemas/JsonSchema'
        version:
          type: integer
        versions:
          type: array
          items:
            $ref: '#/components/schemas/SchemaVersion'
        lifecycle:
          type: string
          enum: [active, decommissioned]
          description: |
            Schema lifecycle state:
            - `active` — usable for Document_Type/channel assignment and validation.
            - `decommissioned` — retired; cannot be assigned to new Document_Types
              (reactivate to restore).
        dIdDefinition:
          $ref: '#/components/schemas/DIdDefinition'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [ref, schema, version, versions, lifecycle, createdAt, updatedAt]
    DocumentTypeConfig:
      type: object
      properties:
        name:
          type: string
        masterSchema:
          type: string
        model:
          $ref: '#/components/schemas/DocumentModel'
        ttl:
          $ref: '#/components/schemas/Ttl'
        channels:
          type: array
          items:
            type: string
          description: Channel IDs registered against this Document_Type.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [name, masterSchema, model]
    ChannelConfig:
      type: object
      properties:
        channelId:
          type: string
        documentType:
          type: string
        channelSchema:
          type: [string, 'null']
        enrichmentBindings:
          type: array
          items:
            $ref: '#/components/schemas/EnrichmentBinding'
        status:
          type: string
          enum: [active, inactive]
          description: |
            Channel status:
            - `active` — accepting ingestion.
            - `inactive` — suspended; ingestion rejected with `CHANNEL_INACTIVE`.
        endpoint:
          type: string
          description: The ingest URL path for this channel.
      required: [channelId, documentType, status]
    EnrichmentBinding:
      type: object
      properties:
        fieldPath:
          type: string
        staticValue:
          description: The static value injected at `fieldPath` (any JSON type).
      required: [fieldPath, staticValue]
    Subscription:
      type: object
      properties:
        id:
          type: string
          description: Server-assigned subscription identifier.
        scope:
          type: string
          enum: [document_type, document_id]
          description: >
            `document_type` fires for any document of the type; `document_id`
            fires for the single document named by `dId`.
        documentType:
          type: string
        dId:
          $ref: '#/components/schemas/StoredDId'
        callbackUrl:
          type: string
          format: uri
        path:
          type: string
        options:
          type: object
          additionalProperties: true
          description: Delivery options (resolved defaults; present on a document_id subscription).
        createdAt:
          type: string
          format: date-time
        active:
          type: boolean
      required: [id, scope, documentType, callbackUrl]
    QuarantineEntry:
      type: object
      description: A quarantined (rejected) ingestion payload with audit context.
      properties:
        ref:
          type: string
          description: Quarantine reference (the quarantineRef returned on rejection).
        payload:
          description: The rejected payload (as received).
        context:
          type: object
          properties:
            receivedAt:
              type: string
              format: date-time
            sourceIdentifier:
              type: string
            schemaRef:
              type: string
            rejectionReason:
              type: string
            rejectionType:
              type: string
              enum: [parse-error, validation-failure, enrichment-conflict]
              description: |
                Why the payload was quarantined:
                - `parse-error` — body was not valid JSON.
                - `validation-failure` — failed schema validation.
                - `enrichment-conflict` — a channel enrichment binding conflicted
                  with the payload under a `discard-and-error` policy.
            controlHeaders:
              type: object
              additionalProperties:
                type: string
              description: The request's TamaDB-* Control_Headers, captured verbatim.
    StorageStrategy:
      type: object
      properties:
        mode:
          $ref: '#/components/schemas/StorageMode'
      required: [mode]
    QuarantinePolicy:
      type: object
      properties:
        policy:
          $ref: '#/components/schemas/QuarantinePolicyValue'
      required: [policy]
    QuarantinePolicyValue:
      type: string
      enum: [off, data-errors-only, all-rejections]
      description: |
        Which rejected ingests are captured in quarantine:
        - `off` — nothing is quarantined.
        - `data-errors-only` — only producer-content (payload-stage) errors:
          a malformed body (`PARSE_ERROR`) or a schema/enrichment validation
          failure. Control-plane and routing/config rejections are excluded.
          (A rename to `payload-errors-only` is a deferred breaking change.)
        - `all-rejections` — every rejection, including routing/config errors.
    EnrichmentPolicies:
      type: object
      properties:
        precedence:
          type: string
          enum: [environment-over-content, content-over-environment]
          description: |
            Who wins when a channel enrichment binding and the producer payload
            both set the same field:
            - `environment-over-content` — the channel-configured (environment)
              value overrides the producer-supplied value.
            - `content-over-environment` — the producer-supplied value wins.
        conflictResolution:
          type: string
          enum: [accept-and-warn, discard-and-error]
          description: |
            What happens on an enrichment conflict:
            - `accept-and-warn` — apply the precedence rule, store the document,
              and emit a warning.
            - `discard-and-error` — reject the ingest with `ENRICHMENT_CONFLICT`
              (and quarantine per policy).
    LoggingState:
      type: object
      description: The current logging configuration (both fields are returned).
      properties:
        level:
          $ref: '#/components/schemas/LogLevel'
        destination:
          $ref: '#/components/schemas/LogDestination'
        filePath:
          type: string
          description: Target file path; present/relevant when `destination` is `file`.
      additionalProperties: true
    LogDestination:
      type: string
      enum: [stdout, file, none]
      description: |
        Where log output is written:
        - `stdout` — standard output (default).
        - `file` — a file on disk (requires `filePath`).
        - `none` — discard log output.
    Error:
      type: object
      description: The standard error response shape.
      properties:
        code:
          type: string
          description: Machine-readable error code (see the error-code table).
        message:
          type: string
        reason:
          type: string
        context:
          type: object
          properties:
            operation:
              type: string
            documentType:
              type: string
            dId:
              type: string
            path:
              type: string
            versionNo:
              type: integer
        quarantineRef:
          type: string
          description: Present when the rejected payload was quarantined.
        warning:
          type: string
      required: [code, message]
