openapi: 3.1.0

info:
  title: TamaDB API
  version: 0.5.0
  summary: Document-centric transmission cache — REST API reference.
  description: |
    **TamaDB** is a document-centric *transmission cache* for
    smart-endpoints / dumb-pipes architectures: a JSON document-oriented cache
    engine that validates, versions, and delivers producer data to consumers.
    This is the complete REST API reference for **Increment 1**.

    This document is the **single source of truth** for the TamaDB HTTP surface.
    It is linted in CI (`redocly lint`) and rendered to the published API
    Reference by Redoc, so the docs cannot silently drift from the contract.

    ## Conventions

    - All endpoints exchange `application/json`, **except** the ingestion
      endpoints, whose request body is the **bare JSON document** (see
      *Ingestion*).
    - Every endpoint lives under the `/api/v1` prefix **except** `GET /health`.
    - There is **no authentication** in Increment 1.
    - Path parameters are shown as `{paramName}`.

    ## Upsert semantics

    TamaDB documents are **upserted** — there is no separate create vs update.
    The first ingest of a given identity creates the document (HTTP `201`); a
    subsequent ingest of the same identity **merges** into it (HTTP `200`),
    preserving absent leaves and incrementing the version number.

    ## Document identity and identityKind

    A document's identity (**D-Id**) is derived from one or more payload fields
    annotated with the `identityKind` keyword in the schema. Identity is scoped
    to `(Document_Type, D-Id)`.

    `identityKind` is a **custom (vendor) JSON Schema keyword** that TamaDB reads
    from registered schemas to extract the D-Id. It is attached to **scalar
    leaf** properties and takes one of two values:

    - `primary-key` — a field that contributes to the document's own identity.
    - `parent-key` — a field that contributes a parent/ancestor identity segment.

    It may be annotated at **any object-nesting depth** (universal nested-path
    identity, since 0.2.0); the field is addressed by its root-to-leaf
    *Identity_Path*. Arrays are never traversed (atomic in Increment 1) and the
    annotated value must be a scalar. The keyword is **ignored by schema
    validation** (Ajv runs with `strict: false`) and consumed only by the D-Id
    Extractor. It is therefore a property of the *posted schema*, not a
    request/response field. See the *Schemas* tag for how to register a schema
    carrying `identityKind`.

    A **composed** (multi-field) D-Id is expressed in a URL by joining its parts
    with the `:` delimiter. **Each part is percent-encoded** (via
    `encodeURIComponent`, and `:` is additionally encoded as `%3A`) so that a
    part value may itself contain the delimiter, `/`, or other reserved
    characters without corrupting the part boundaries. In response bodies, a
    single-key `dId` is a string and a composed `dId` is an array of strings.

    ## TTL & expiry (sliding window)

    A cached document's TTL is a **sliding window anchored to its last update**
    (`lastUpdateTime + effectiveTTL`), re-armed on **every store** (create or
    merge) — since 0.4.0. Reads and value-search listings **never** re-arm the
    window. A continuously-updated document therefore persists indefinitely by
    design (the producer owns the cache lifetime). A store targeting an
    expired-but-salvageable document **revives** it.

    The TTL hierarchy is **Document > Document_Type > Instance** (most specific
    wins). `TamaDB-Expire-At` is an absolute, non-sliding, non-salvageable
    deadline that overrides TTL.

    ## Document metadata and timestamps

    Every store appends a timestamp entry to the stored document carrying a
    **Request_Timestamp** (`t1`, request receipt — the versioning / history /
    TTL-anchor time) and a **Commit_Timestamp** (`t1+m`, write-completion time).
    As of 0.4.1 the `Commit_Timestamp` is **populated** on every stored entry
    (it was previously always empty).

    These timestamps are **document metadata**, not part of the default
    retrieval response: `GET /api/v1/documents/{documentType}/{dId}` returns the
    stored document's own fields (the producer payload plus any enrichment), and
    the `mode` / `path` options only select which *data* fields are returned —
    they never emit the metadata. The `Commit_Timestamp` is delivered on the
    **metadata-delivery (webhook) payload**, which the subscription → webhook
    pipeline carries; that payload is modelled when the delivery pipeline ships.

    ## Error responses

    All errors share a consistent shape (`code` + `message`, with optional
    `reason`, `context`, `quarantineRef`, `warning`). See the `Error` schema and
    the error-code → HTTP-status table in `httpStatusForCode`.
  contact:
    name: Teneris
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: http://localhost:3000
    description: Local Increment 1 instance

tags:
  - name: Health
    description: Liveness / readiness probe, build info, and service-discovery metadata.
  - name: Admin
    description: Operational admin endpoints (e.g. graceful shutdown).
  - name: Ingestion
    description: >
      Document ingestion. The request body is the **bare JSON document**;
      per-request instructions travel as reserved `TamaDB-*` Control_Headers.
  - name: Documents
    description: Retrieve, delete, value-search, and set per-document TTL.
  - name: Schemas
    description: JSON Schema repository — register, retrieve, version, lifecycle.
  - name: Document_Types
    description: Document_Type registry and effective Document_Type TTL.
  - name: Channels
    description: Ingestion channels and their enrichment bindings.
  - name: Subscriptions
    description: Webhook subscriptions by Document_Type or document identity.
  - name: Quarantine
    description: Inspect quarantined (rejected) ingestion payloads.
  - name: Configuration
    description: Instance-level configuration (TTL, storage, logging, policies).

paths:
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Liveness / readiness probe
      description: >
        Returns `ok` plus build info (version, commit) and the active storage
        mode and log level. This is the only endpoint **not** under `/api/v1`.
      responses:
        '200':
          description: The instance is up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: ok
                version: 0.5.1
                commit: 5e1efe539201
                storageMode: auto
                logLevel: debug

  /api/v1/info:
    get:
      tags: [Health]
      operationId: getServiceInfo
      summary: Service information (discovery / metadata)
      description: >
        Service-discovery metadata — stable identity, version/build fingerprint,
        environment, operational status, and where to find the docs — for humans
        and client tooling. Distinct from `/health`, which is the lightweight
        liveness/readiness probe. All values are resolved at runtime (from
        package.json / build-info) or from configuration (`TAMADB_ENV`,
        `TAMADB_DOCS_URL`, `TAMADB_OPENAPI_URL`), so a self-hosted instance can
        report its own environment and doc locations.
      responses:
        '200':
          description: Service information.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceInfo'
              example:
                name: tamadb
                description: >-
                  TamaDB — a document-centric transmission cache for
                  smart-endpoints/dumb-pipes architectures; a JSON
                  document-oriented cache engine for producer/consumer data
                  exchange (Increment 1).
                version: 0.5.1
                commit: 5e1efe539201
                apiVersion: v1
                environment: increment-1
                status: operational
                documentation: https://tamadb.cc/api-reference.html
                openapi: https://tamadb.cc/openapi.yaml
                startedAt: '2026-10-17T12:49:37.086Z'

  /api/v1/admin/shutdown:
    post:
      tags: [Admin]
      operationId: shutdown
      summary: Trigger a graceful shutdown
      description: >
        Responds `200` immediately, then (asynchronously) drains in-memory
        documents to disk, persists all component state, closes the HTTP server,
        and exits the process. The recommended cross-platform way to stop TamaDB
        (SIGTERM can be unreliable on some platforms). After the response, the
        server stops accepting new requests.
      responses:
        '200':
          description: Shutdown accepted; the process will exit shortly.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    const: shutting-down
                required: [status]
              example:
                status: shutting-down

  /api/v1/ingest/{documentType}:
    post:
      tags: [Ingestion]
      operationId: ingestDocument
      summary: Ingest a document (default channel)
      description: |
        Ingest a document for `{documentType}` via the default channel. The
        **request body is the bare JSON document** (a JSON object), not a
        wrapper. Per-request instructions are supplied as reserved `TamaDB-*`
        Control_Headers (see parameters).

        Returns `201` when the document is created and `200` when an existing
        document is merged (upsert). On a payload-level rejection the response
        carries an `Error` with an optional `quarantineRef`.

        Each successful store records a timestamp entry on the stored document
        with a populated **Commit_Timestamp** (write-completion time; see
        *Document metadata and timestamps*). This metadata is not returned in
        the ingest response — the response body is the `IngestResult` below.
      parameters:
        - $ref: '#/components/parameters/DocumentTypePath'
        - $ref: '#/components/parameters/TamaDBVersion'
        - $ref: '#/components/parameters/TamaDBTtl'
        - $ref: '#/components/parameters/TamaDBExpireAt'
        - $ref: '#/components/parameters/TamaDBSchema'
      requestBody:
        $ref: '#/components/requestBodies/BareDocument'
      responses:
        '201':
          $ref: '#/components/responses/IngestCreated'
        '200':
          $ref: '#/components/responses/IngestMerged'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /api/v1/ingest/{documentType}/{channelId}:
    post:
      tags: [Ingestion]
      operationId: ingestDocumentViaChannel
      summary: Ingest a document via a named channel
      description: >
        As `POST /api/v1/ingest/{documentType}`, but routes through the named
        `{channelId}` so channel enrichment and the channel schema apply.
      parameters:
        - $ref: '#/components/parameters/DocumentTypePath'
        - $ref: '#/components/parameters/ChannelIdPath'
        - $ref: '#/components/parameters/TamaDBVersion'
        - $ref: '#/components/parameters/TamaDBTtl'
        - $ref: '#/components/parameters/TamaDBExpireAt'
        - $ref: '#/components/parameters/TamaDBSchema'
      requestBody:
        $ref: '#/components/requestBodies/BareDocument'
      responses:
        '201':
          $ref: '#/components/responses/IngestCreated'
        '200':
          $ref: '#/components/responses/IngestMerged'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /api/v1/documents/{documentType}/{dId}:
    get:
      tags: [Documents]
      operationId: retrieveDocument
      summary: Retrieve a document (or glob-match)
      description: |
        Retrieve a single document by `{documentType}` and `{dId}`.

        If `{dId}` contains glob characters (`*` or `?`), the endpoint switches
        to **glob retrieval** and returns a `{ matches, count }` collection
        instead of a single document.

        A TTL-expired but *salvageable* document is served **in place** as a
        Best-Effort Read (visibility only — the read does not re-arm the TTL,
        restore the document, or clear its soft-delete state).
      parameters:
        - $ref: '#/components/parameters/DocumentTypePath'
        - $ref: '#/components/parameters/DIdPath'
        - name: path
          in: query
          required: false
          description: Field/sub-path projection (dotted path into the document).
          schema:
            type: string
        - name: mode
          in: query
          required: false
          description: |
            Projection model controlling which fields the returned document
            carries (default `full`):
            - `closed` — only fields defined in the applicable schema.
            - `open` — schema fields plus any extension fields present.
            - `full` — the entire stored document, unfiltered.
          schema:
            type: string
            enum: [closed, open, full]
            default: full
      responses:
        '200':
          description: The document, or a glob match collection.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                description: >
                  One of three shapes depending on the request: a single
                  **Document** (default), a **DocumentMatches** collection
                  (`{ matches, count }` — when the D-Id is a glob), or a
                  `{ "_value": ... }` projection (when `?path=` is given). See
                  the examples.
              examples:
                single:
                  summary: Single document by D-Id
                  value:
                    sensorId: GARAGE-TEMP-01
                    location: Garage
                    temperature: 19.1
                    timestamp: '2026-07-17T10:10:00Z'
                composed:
                  summary: Composed D-Id (retrieved via ORD-1001:L-1)
                  value:
                    orderId: ORD-1001
                    lineId: L-1
                    sku: WIDGET-A
                    qty: 3
                glob:
                  summary: Glob match collection (D-Id contains * or ?)
                  value:
                    matches:
                      - sensorId: LIVING-ROOM-01
                        location: Living Room
                        temperature: 21.5
                        timestamp: '2026-07-17T10:05:00Z'
                      - sensorId: GARAGE-TEMP-01
                        location: Garage
                        temperature: 19.1
                        timestamp: '2026-07-17T10:10:00Z'
                    count: 2
                projection:
                  summary: Field projection (?path=temperature)
                  value:
                    _value: 19.1
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Documents]
      operationId: deleteDocument
      summary: Explicitly soft-delete a document
      description: >
        Soft-deletes the document with reason `explicit`. An explicit delete is
        permanent (non-salvageable) and is not revived by a later store.
      parameters:
        - $ref: '#/components/parameters/DocumentTypePath'
        - $ref: '#/components/parameters/DIdPath'
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    const: true
                required: [deleted]
              example:
                deleted: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/documents/{documentType}/search:
    post:
      tags: [Documents]
      operationId: searchDocumentsByValue
      summary: Value-based search within a Document_Type
      description: |
        Returns all documents of `{documentType}` whose `field` equals `value`.

        `includeExpired` controls whether TTL-driven salvageable soft-deletes
        are surfaced. **It defaults to `true`** when omitted. Search is
        visibility-only: it never alters the TTL clock or persists a state
        change. A document listed by search is **not** guaranteed retrievable by
        a later point lookup (Req 15.9).
      parameters:
        - $ref: '#/components/parameters/DocumentTypePath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                field:
                  type: string
                  description: The field name (or path) to match on.
                value:
                  description: The value to match (any JSON type).
                includeExpired:
                  type: boolean
                  default: true
                  description: |
                    Whether TTL-driven, salvageable soft-deleted documents are
                    surfaced in the results (visibility only — never alters the
                    TTL clock or persists a state change):
                    - `true` (default) — include salvageable TTL-expired
                      documents, consistent with point-lookup Best-Effort Read.
                    - `false` — return only live (non-expired) documents.

                    Non-salvageable soft-deletes (`explicit`, `system_override`,
                    `absolute_expired`, and TTL = 0) are never surfaced either way.
              required: [field, value]
            example:
              field: location
              value: Garage
      responses:
        '200':
          description: Matching documents.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentMatches'
              example:
                matches:
                  - sensorId: GARAGE-TEMP-01
                    location: Garage
                    temperature: 19.1
                    timestamp: '2026-07-17T10:10:00Z'
                count: 1
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/documents/{documentType}/{dId}/ttl:
    put:
      tags: [Documents]
      operationId: setDocumentTtl
      summary: Set a per-document (most-specific) TTL
      description: >
        Sets the document-level TTL — the most specific rung of the TTL
        hierarchy (Document > Document_Type > Instance). A TTL below the
        configured floor is raised to the floor and reported via `warning`.
      parameters:
        - $ref: '#/components/parameters/DocumentTypePath'
        - $ref: '#/components/parameters/DIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ttl:
                  $ref: '#/components/schemas/Ttl'
              required: [ttl]
            example:
              ttl: 7200
      responses:
        '200':
          description: TTL set.
          content:
            application/json:
              schema:
                type: object
                properties:
                  documentType:
                    type: string
                  dId:
                    type: string
                  ttl:
                    $ref: '#/components/schemas/Ttl'
                  warning:
                    $ref: '#/components/schemas/TtlWarning'
                required: [documentType, dId, ttl]
              example:
                documentType: temperature-readings
                dId: GARAGE-TEMP-01
                ttl: 7200
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/schemas:
    post:
      tags: [Schemas]
      operationId: registerSchema
      summary: Register a schema
      description: |
        Register a JSON Schema under a unique `ref`. The schema may carry
        `identityKind` annotations (`primary-key` / `parent-key`) on scalar leaf
        properties to drive D-Id extraction; those annotations are ignored by
        validation. An optional `dIdDefinition` provides a metadata fallback for
        third-party schemas that cannot be annotated inline.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ref:
                  type: string
                  description: Unique schema reference.
                schema:
                  $ref: '#/components/schemas/JsonSchema'
                dIdDefinition:
                  $ref: '#/components/schemas/DIdDefinition'
              required: [ref, schema]
            example:
              ref: temperature-sensor-v1
              schema:
                $schema: http://json-schema.org/draft-07/schema#
                type: object
                properties:
                  sensorId:
                    type: string
                    identityKind: primary-key
                  location:
                    type: string
                  temperature:
                    type: number
                  timestamp:
                    type: string
                required: [sensorId, location, temperature]
      responses:
        '201':
          description: Registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaRegisterResult'
              example:
                ref: temperature-sensor-v1
                version: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      tags: [Schemas]
      operationId: listSchemas
      summary: List all registered schemas
      description: >
        Returns every registered schema entry. Symmetric with
        `GET /api/v1/config/document-types`. **Added in 0.5.0.**
      responses:
        '200':
          description: All schema entries.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SchemaEntry'
              example:
                - ref: temperature-sensor-v1
                  schema:
                    type: object
                    properties:
                      sensorId:
                        type: string
                        identityKind: primary-key
                    required: [sensorId]
                  version: 1
                  versions:
                    - version: 1
                      schema:
                        type: object
                      timestamp: '2026-07-17T09:00:00Z'
                  lifecycle: active
                  createdAt: '2026-07-17T09:00:00Z'
                  updatedAt: '2026-07-17T09:00:00Z'

  /api/v1/schemas/{schemaRef}:
    get:
      tags: [Schemas]
      operationId: getSchema
      summary: Retrieve a schema entry
      parameters:
        - $ref: '#/components/parameters/SchemaRefPath'
      responses:
        '200':
          description: The schema entry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaEntry'
              example:
                ref: temperature-sensor-v1
                schema:
                  $schema: http://json-schema.org/draft-07/schema#
                  type: object
                  properties:
                    sensorId:
                      type: string
                      identityKind: primary-key
                    location:
                      type: string
                    temperature:
                      type: number
                    timestamp:
                      type: string
                  required: [sensorId, location, temperature]
                version: 1
                versions:
                  - version: 1
                    schema:
                      type: object
                    timestamp: '2026-07-17T09:00:00Z'
                lifecycle: active
                createdAt: '2026-07-17T09:00:00Z'
                updatedAt: '2026-07-17T09:00:00Z'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Schemas]
      operationId: updateSchema
      summary: Update a schema (creates a new version)
      parameters:
        - $ref: '#/components/parameters/SchemaRefPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                schema:
                  $ref: '#/components/schemas/JsonSchema'
              required: [schema]
            example:
              schema:
                $schema: http://json-schema.org/draft-07/schema#
                type: object
                properties:
                  sensorId:
                    type: string
                    identityKind: primary-key
                  location:
                    type: string
                  temperature:
                    type: number
                  humidity:
                    type: number
                  timestamp:
                    type: string
                required: [sensorId, location, temperature]
      responses:
        '200':
          description: Updated (new version number returned).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaRegisterResult'
              example:
                ref: temperature-sensor-v1
                version: 2
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/schemas/{schemaRef}/decommission:
    post:
      tags: [Schemas]
      operationId: decommissionSchema
      summary: Decommission a schema
      description: >
        Rejected while the schema is the Master_Schema of an active
        Document_Type (`MASTER_SCHEMA_ACTIVE`).
      parameters:
        - $ref: '#/components/parameters/SchemaRefPath'
      responses:
        '200':
          description: Decommissioned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  decommissioned:
                    const: true
                required: [decommissioned]
              example:
                decommissioned: true
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/schemas/{schemaRef}/reactivate:
    post:
      tags: [Schemas]
      operationId: reactivateSchema
      summary: Reactivate a decommissioned schema
      parameters:
        - $ref: '#/components/parameters/SchemaRefPath'
      responses:
        '200':
          description: Reactivated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  reactivated:
                    const: true
                required: [reactivated]
              example:
                reactivated: true
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/schemas/{schemaRef}/versions:
    get:
      tags: [Schemas]
      operationId: getSchemaVersions
      summary: List a schema's version history
      parameters:
        - $ref: '#/components/parameters/SchemaRefPath'
      responses:
        '200':
          description: Version history (oldest first).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SchemaVersion'
              example:
                - version: 1
                  schema:
                    type: object
                  timestamp: '2026-07-17T09:00:00Z'
                - version: 2
                  schema:
                    type: object
                  timestamp: '2026-07-17T09:30:00Z'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/config/document-types:
    post:
      tags: [Document_Types]
      operationId: registerDocumentType
      summary: Register a Document_Type
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                masterSchema:
                  type: string
                  description: Ref of the registered Master_Schema.
                model:
                  $ref: '#/components/schemas/DocumentModel'
                ttl:
                  $ref: '#/components/schemas/Ttl'
              required: [name, masterSchema, model]
            example:
              name: temperature-readings
              masterSchema: temperature-sensor-v1
              model: closed
              ttl: 3600
      responses:
        '201':
          description: Registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentTypeConfig'
              example:
                name: temperature-readings
