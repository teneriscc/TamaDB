  /api/v1/config/channels/{channelId}/enrichment:
    put:
      tags: [Channels]
      operationId: setChannelEnrichment
      summary: Register enrichment bindings for a channel
      description: >
        Each binding sets a static value at a field path during ingestion.
        `dIdClassification` reports whether any binding targets an
        `identityKind`-annotated field (`foreign`) or not (`native`).
      parameters:
        - $ref: '#/components/parameters/ChannelIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                bindings:
                  type: array
                  items:
                    $ref: '#/components/schemas/EnrichmentBinding'
              required: [bindings]
            example:
              bindings:
                - fieldPath: sensorId
                  staticValue: GARAGE-TEMP-01
                - fieldPath: location
                  staticValue: Garage
      responses:
        '200':
          description: Registered.
          content:
            application/json:
              schema:
                type: object
                properties:
                  registered:
                    const: true
                  dIdClassification:
                    type: string
                    enum: [native, foreign]
                    description: |
                      Whether any registered binding targets a D-Id
                      (`identityKind`-annotated) field:
                      - `native` — no binding touches an identity field.
                      - `foreign` — at least one binding sets an identity field,
                        so the channel supplies (part of) the document's D-Id.
                required: [registered, dIdClassification]
              example:
                registered: true
                dIdClassification: native
        '400':
          $ref: '#/components/responses/BadRequest'
    get:
      tags: [Channels]
      operationId: getChannelEnrichment
      summary: Get a channel's enrichment bindings
      parameters:
        - $ref: '#/components/parameters/ChannelIdPath'
      responses:
        '200':
          description: Bindings.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EnrichmentBinding'
              example:
                - fieldPath: sensorId
                  staticValue: GARAGE-TEMP-01
                - fieldPath: location
                  staticValue: Garage
    delete:
      tags: [Channels]
      operationId: deleteChannelEnrichment
      summary: Delete a channel's enrichment bindings
      parameters:
        - $ref: '#/components/parameters/ChannelIdPath'
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    const: true
                required: [deleted]
              example:
                deleted: true

  /api/v1/subscriptions:
    post:
      tags: [Subscriptions]
      operationId: createSubscription
      summary: Create a webhook subscription
      description: >
        Subscribe to document events by `document_type` or `document_id` scope.
        When scope is `document_id`, provide `dId`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                scope:
                  type: string
                  enum: [document_type, document_id]
                  description: |
                    What the subscription watches:
                    - `document_type` — fires for any document of
                      `documentType`.
                    - `document_id` — fires for one specific document (requires
                      `dId`).
                documentType:
                  type: string
                dId:
                  type: string
                  description: Required when scope is `document_id`.
                callbackUrl:
                  type: string
                  format: uri
                path:
                  type: string
                  description: Optional sub-path (leaf/bunch) filter within the document.
                options:
                  type: object
                  additionalProperties: true
              required: [scope, documentType, callbackUrl]
            example:
              scope: document_type
              documentType: temperature-readings
              callbackUrl: https://consumer.example.com/webhook
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
              example:
                id: sub-muu900km-0001
                scope: document_type
                documentType: temperature-readings
                callbackUrl: https://consumer.example.com/webhook
                options:
                  retrievalMode: full
                  schemaAdoptionMode: pinned
                  payloadFormat: envelope
                  includeMetadata: false
                  deliveryMode: fire-and-forget
                createdAt: '2026-07-17T10:15:00Z'
                active: true
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/subscriptions/{subscriptionId}:
