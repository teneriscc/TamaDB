          application/json:
            schema:
              type: object
              properties:
                channelSchema:
                  type: [string, 'null']
                  description: New Channel_Schema ref, or null to clear.
            example:
              channelSchema: temperature-sensor-v1
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelConfig'
              example:
                channelId: garage-sensor
                documentType: temperature-readings
                channelSchema: temperature-sensor-v1
                enrichmentBindings: []
                status: active
                endpoint: /api/v1/ingest/temperature-readings/garage-sensor
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Channels]
      operationId: deleteChannel
      summary: Delete a channel
      parameters:
        - $ref: '#/components/parameters/ChannelIdPath'
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    const: true
                required: [deleted]
              example:
                deleted: true
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/config/channels/{channelId}/activate:
