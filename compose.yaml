# TamaDB — Docker Compose (Compose Specification).
# Run:  docker compose up -d      Stop: docker compose down
# Uses the published multi-arch image from Docker Hub.

services:
  tamadb:
    image: teneriscc/tamadb:0.1.0
    container_name: tamadb
    ports:
      - "3000:3000"
    environment:
      # All optional — shown with their defaults.
      TAMADB_PORT: "3000"
      TAMADB_HOST: "0.0.0.0"
      TAMADB_LOG_LEVEL: "debug"      # debug | info | warn | error | silent
      TAMADB_STORAGE_MODE: "auto"    # auto | memory | disk | hybrid
    volumes:
      # Persist state across restarts. Omit for an ephemeral instance,
      # or set TAMADB_STORAGE_MODE=memory to disable persistence entirely.
      - tamadb-data:/app/.tamadb-data
    restart: unless-stopped
    healthcheck:
      # Mirrors the image's built-in HEALTHCHECK against /health.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.TAMADB_PORT||3000)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

volumes:
  tamadb-data:
